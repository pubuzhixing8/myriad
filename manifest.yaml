# yaml-language-server: $schema=node_modules/@pc-nexus/manifest/schema/manifest.schema.json
app:
  version: 1.0.0
  id: 8e4e40af-23ea-43cc-98af-1a851af87319
extensions:
  - key: myriad-button
    target: pcm:wiki:document:block
    title: Myriad - Button
    icon: resource:button/myriad.svg
    resource: button
    layout: inline
    behavior: modal
    edit:
      title: Myriad - Button
      icon: resource:button/myriad.svg
      resource: button
      viewport:
        size: large
      openOnInsert: true
  - key: myriad-background
    target: pcm:wiki:document:block
    title: Myriad - Background
    icon: resource:button/myriad.svg
    resource: background
    layout: bodied
    behavior: modal
    edit:
      title: Myriad - Background
      icon: resource:button/myriad.svg
      resource: background
      viewport:
        size: large
      openOnInsert: true
  - key: myriad-cards
    target: pcm:wiki:document:block
    title: Myriad - Pages
    icon: resource:button/myriad.svg
    resource: cards
    layout: bodied
    resolver:
      function: resolver
    behavior: modal
    emitReadyEvent: true
    edit:
      title: Myriad - Pages
      icon: resource:button/myriad.svg
      resource: cards
      viewport:
        size: xlarge
      openOnInsert: true
  - key: myriad-dynamic-content
    target: pcm:wiki:document:block
    title: Myriad - Dynamic Content
    icon: resource:button/myriad.svg
    resource: dynamic-content
    layout: bodied
    resolver:
      function: resolver
    behavior: modal
    emitReadyEvent: true
    edit:
      title: Myriad - Dynamic Content
      icon: resource:button/myriad.svg
      resource: dynamic-content
      viewport:
        size: xlarge
      openOnInsert: true
functions:
  - key: resolver
    handler: index.resolver
resources:
  - key: button
    path: web/button/dist
  - key: background
    path: plugins/background/native-ui/main.tsx
    render: native
  - key: cards
    path: web/pages/dist
  - key: dynamic-content
    path: web/dynamic-content/dist
permissions:
  scopes:
    - pcp:read:app-user-token
    - pcp:read:wiki:page
    - pcp:read:wiki:space
  external:
    images:
      - https://images.unsplash.com
      - https://at.alicdn.com
