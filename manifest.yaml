# yaml-language-server: $schema=node_modules/@pc-nexus/manifest/schema/manifest.schema.json
app:
  version: 1.0.0
  id: 8e4e40af-23ea-43cc-98af-1a851af87319
extensions:
  - key: myriad-button
    target: pcm:wiki:document:block
    title: Myriad - Button
    icon: resource:button/myriad.svg
    resource: button
    layout: inline
    resolver:
      function: resolver
    behavior: modal
    edit:
      title: Myriad - Button
      icon: resource:button/myriad.svg
      resource: button
      viewport:
        size: large
      openOnInsert: true
  - key: myriad-background
    target: pcm:wiki:document:block
    title: Myriad - Background
    icon: resource:button/myriad.svg
    resource: background
    layout: bodied
    resolver:
      function: resolver
    behavior: modal
    edit:
      title: Myriad - Background
      icon: resource:button/myriad.svg
      resource: background
      viewport:
        size: large
      openOnInsert: true
functions:
  - key: resolver
    handler: index.resolver
resources:
  - key: button
    path: web/main/dist
  - key: background
    path: web/native/main.tsx
    render: native
permissions:
  scopes: []
  external:
    images:
      - https://images.unsplash.com
      - https://at.alicdn.com
