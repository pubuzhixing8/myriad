# yaml-language-server: $schema=node_modules/@pc-nexus/manifest/schema/manifest.schema.json
app:
  version: 1.0.0
  id: 98d7facb-deef-49c7-a1ad-9bc9acd9fc6e
extensions:
  - key: myriad-button
    target: pcm:wiki:document:block
    title: Myriad - Button
    icon: resource:button/myriad.svg
    resource: button
    layout: inline
    behavior: modal
    edit:
      title: Myriad - Button
      icon: resource:button/myriad.svg
      resource: button
      viewport:
        size: large
      openOnInsert: true
  - key: myriad-background
    target: pcm:wiki:document:block
    title: Myriad - Background
    icon: resource:button/myriad.svg
    resource: background
    layout: bodied
    behavior: modal
    edit:
      title: Myriad - Background
      icon: resource:button/myriad.svg
      resource: background
      viewport:
        size: large
      openOnInsert: true
  - key: myriad-cards
    target: pcm:wiki:document:block
    title: Myriad - Cards
    resource: cards
    resolver:
      function: resolver
    behavior: modal
    emitReadyEvent: true
    edit:
      title: Myriad - Cards
      resource: cards
      viewport:
        size: xlarge
      openOnInsert: true
functions:
  - key: resolver
    handler: index.resolver
resources:
  - key: button
    path: web/button/dist
  - key: background
    path: plugins/background/native-ui/main.tsx
    render: native
  - key: cards
    path: web/cards/dist
permissions:
  scopes:
    - pcp:read:app-user-token
    - pcp:read:wiki:page
    - pcp:read:wiki:space
  external:
    images:
      - https://images.unsplash.com
      - https://at.alicdn.com
